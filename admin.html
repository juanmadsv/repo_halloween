<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administración | Halloween Vote</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-icon">🎃</span><span>Halloween <b>Vote</b></span></a><nav id="navigation" class="nav-links"></nav></header>
<main class="container admin-container"><section class="section-heading admin-heading"><div><span class="eyebrow">Panel de control</span><h1>Administrar disfraces</h1><p class="muted">Creá, editá y quitá disfraces de la votación.</p></div><button id="new-costume" class="button button-primary">＋ Nuevo disfraz</button></section><div id="notice" class="notice hidden" role="status"></div><section id="admin-list" class="admin-list" aria-live="polite"><div class="loading-card">Cargando disfraces…</div></section></main>
<dialog id="costume-dialog" class="modal"><form id="costume-form" class="form-stack"><div class="modal-heading"><div><span class="eyebrow">Ficha del disfraz</span><h2 id="dialog-title">Nuevo disfraz</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Cerrar">×</button></div><input type="hidden" name="id"><label>Nombre<input name="nombre" maxlength="50" required></label><label>Descripción<textarea name="descripcion" rows="4" maxlength="10000" required></textarea></label><label>Foto (JPG, PNG o WebP, hasta 5 MB)<input name="foto" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="dialog-message" class="notice hidden" role="alert"></div><div class="modal-actions"><button type="button" class="button button-secondary" id="cancel-dialog">Cancelar</button><button class="button button-primary" type="submit">Guardar</button></div></form></dialog>
<script src="assets/app.js"></script><script src="assets/admin.js"></script></body></html>
